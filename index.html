<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>إدارة المخزون والمبيعات</title>
<meta name="theme-color" content="#0b0f16">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="المخزون والمبيعات">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root { --bg: #0b0f16; --card: #141b26; --line: #263041; --ink: #e9edf3; --dim: #93a0b2; --gold: #e2b357; --gold2: #c08a2c; --err: #ef8a7a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: system-ui, "Segoe UI", Tahoma, Arial, sans-serif; overflow: hidden; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: none; background: var(--bg); }
  body.linked #app { display: block; }
  .screen { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 24px 16px calc(24px + env(safe-area-inset-bottom)); background: radial-gradient(120% 80% at 50% 0%, #1b2433 0%, var(--bg) 60%); overflow-y: auto; }
  .screen.show { display: flex; }
  .card { width: 100%; max-width: 420px; text-align: center; }
  .logo { width: 88px; height: 88px; border-radius: 22px; box-shadow: 0 10px 30px rgba(0,0,0,.45), 0 0 0 1px rgba(226,179,87,.25); }
  h1 { font-size: 22px; margin: 18px 0 4px; }
  .co { font-weight: 700; font-size: 16px; margin-top: 14px; color: var(--gold); }
  .co:empty { display: none; }
  .logo.custom { background: #fff; object-fit: contain; padding: 6px; }
  .sub { color: var(--dim); font-size: 14px; margin: 0 0 22px; line-height: 1.7; }
  label { display: block; text-align: right; font-size: 13px; color: var(--dim); margin: 0 0 6px; }
  input { width: 100%; direction: ltr; text-align: left; font-size: 14px; padding: 13px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink); outline: none; }
  input:focus { border-color: var(--gold); }
  button { width: 100%; margin-top: 12px; padding: 13px; font-size: 15px; font-weight: 700; border-radius: 12px; border: 0; cursor: pointer; font-family: inherit; }
  .primary { background: linear-gradient(135deg, var(--gold), var(--gold2)); color: #1a1205; }
  .ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .err { color: var(--err); font-size: 13px; min-height: 18px; margin-top: 8px; }
  .hint { color: var(--dim); font-size: 12.5px; line-height: 1.8; margin-top: 18px; text-align: right; background: rgba(255,255,255,.03); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .hint b { color: var(--ink); }
  .spin { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(226,179,87,.2); border-top-color: var(--gold); animation: sp 0.9s linear infinite; margin: 22px auto 0; }
  @keyframes sp { to { transform: rotate(360deg); } }
  #installBar { position: fixed; z-index: 5; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); display: none; align-items: center; gap: 10px; background: #182131; border: 1px solid rgba(226,179,87,.35); border-radius: 14px; padding: 10px 12px; box-shadow: 0 12px 30px rgba(0,0,0,.5); font-size: 13.5px; }
  #installBar.show { display: flex; }
  #installBar span { flex: 1; line-height: 1.6; }
  #installBar button { width: auto; margin: 0; padding: 8px 14px; font-size: 13px; }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
</style>
</head>
<body>

<!-- 1) أول مرة: ربط التطبيق بلينك البرنامج -->
<section class="screen" id="setup">
  <div class="card">
    <img class="logo" data-brand-logo src="icons/icon-192.png" alt="">
    <h1 data-brand-name>إدارة المخزون والمبيعات</h1>
    <p class="sub">أول مرة بس: الصق لينك البرنامج اللي وصلك من الشركة</p>
    <label for="url">لينك البرنامج</label>
    <input id="url" type="url" inputmode="url" autocomplete="off" placeholder="https://script.google.com/macros/s/…/exec">
    <div class="err" id="err"></div>
    <button class="primary" id="go">اربط وافتح البرنامج</button>
    <button class="ghost" id="installBtn" hidden>📲 ثبّت التطبيق على الجهاز</button>
    <div class="hint" id="howto"></div>
  </div>
</section>

<!-- 2) التحميل / مفيش نت -->
<section class="screen" id="loading">
  <div class="card">
    <img class="logo" data-brand-logo src="icons/icon-192.png" alt="">
    <div class="co" data-brand-co></div>
    <h1 id="ldTitle">جاري فتح البرنامج…</h1>
    <p class="sub" id="ldSub"></p>
    <div class="spin" id="ldSpin"></div>
    <button class="primary" id="retry" hidden>حاول تاني</button>
    <button class="ghost" id="relink" hidden>غيّر لينك البرنامج</button>
  </div>
</section>

<iframe id="app" title="البرنامج" allow="camera *; clipboard-read *; clipboard-write *; fullscreen *; autoplay *" referrerpolicy="no-referrer-when-downgrade"></iframe>

<div id="installBar"><span id="ibText">ثبّت البرنامج على الجهاز عشان يفتح زي أي تطبيق</span><button class="primary" id="ibGo">تثبيت</button><button class="ghost" id="ibNo">مش دلوقتي</button></div>

<script>
(function () {
  var KEY = 'stockAppUrl', NOINSTALL = 'stockNoInstall', BRAND = 'stockAppBrand';
  var $ = function (id) { return document.getElementById(id); };
  var store = {
    get: function (k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) { /* private mode */ } },
    del: function (k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } }
  };
  var ua = navigator.userAgent || '';
  var isIOS = /iphone|ipad|ipod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  var deferredPrompt = null, loadTimer = null, loaded = false;

  /* لينك Apps Script: https://script.google.com/macros/s/ID/exec (أو /a/macros/الدومين/s/ID/exec لحسابات الشركات) */
  function cleanUrl(raw) {
    var s = String(raw || '').trim();
    if (!s) return '';
    if (!/^https?:\/\//i.test(s)) s = 'https://' + s;
    var u; try { u = new URL(s); } catch (e) { return ''; }
    if (u.hostname !== 'script.google.com') return '';
    if (!/^\/(a\/macros\/[^\/]+|macros)\/s\/[A-Za-z0-9_-]{20,}\/(exec|dev)$/.test(u.pathname)) return '';
    return 'https://script.google.com' + u.pathname + (u.search || '');
  }
  function show(id) { ['setup', 'loading'].forEach(function (x) { $(x).classList.toggle('show', x === id); }); }

  function howto() {
    var h;
    if (standalone) h = 'التطبيق متثبّت ✔ — اللينك بيتحفظ على الجهاز ده ومش هيطلبه تاني.';
    else if (isIOS) h = '<b>آيفون:</b> بعد الربط افتح الصفحة دي من <b>Safari</b> ← زرار المشاركة <b>⬆︎</b> ← <b>Add to Home Screen</b> (إضافة إلى الشاشة الرئيسية) ← Add.';
    else h = '<b>أندرويد:</b> كروم ← ⋮ ← <b>Install app</b> (أو Add to Home screen).<br><b>ويندوز:</b> كروم أو Edge ← أيقونة التثبيت في شريط العنوان أو ⋮ ← <b>Install</b>.';
    $('howto').innerHTML = h;
  }

  function openApp(url) {
    document.body.classList.remove('linked');
    loaded = false;
    show('loading');
    $('ldTitle').textContent = 'جاري فتح البرنامج…'; $('ldSub').textContent = '';
    $('ldSpin').hidden = false; $('retry').hidden = true; $('relink').hidden = false;
    if (!navigator.onLine) { offline(); return; }
    var f = $('app');
    f.onload = function () { loaded = true; clearTimeout(loadTimer); document.body.classList.add('linked'); show(null); maybeInstallBar(); };
    f.src = url;
    clearTimeout(loadTimer);
    loadTimer = setTimeout(function () { if (!loaded) slow(); }, 30000);
  }
  function offline() {
    show('loading');
    $('ldTitle').textContent = 'مفيش اتصال بالنت';
    $('ldSub').textContent = 'البرنامج محتاج نت عشان يفتح. اتأكد من الواي فاي أو الداتا ودوس «حاول تاني».';
    $('ldSpin').hidden = true; $('retry').hidden = false; $('relink').hidden = false;
  }
  function slow() {
    $('ldTitle').textContent = 'البرنامج بياخد وقت…';
    $('ldSub').textContent = 'لو النت ضعيف استنى شوية. لو فضل كده، دوس «حاول تاني» أو اتأكد إن اللينك صح.';
    $('retry').hidden = false; $('relink').hidden = false;
  }

  function link() {
    var url = cleanUrl($('url').value);
    if (!url) { $('err').textContent = 'اللينك ده مش لينك البرنامج — لازم يبدأ بـ https://script.google.com/macros/s/ وآخره /exec'; return; }
    $('err').textContent = '';
    store.set(KEY, url);
    openApp(url);
  }

  function maybeInstallBar() {
    if (standalone || store.get(NOINSTALL)) return;
    if (deferredPrompt) { $('ibText').textContent = 'ثبّت البرنامج على الجهاز عشان يفتح زي أي تطبيق'; $('ibGo').hidden = false; }
    else if (isIOS) { $('ibText').innerHTML = 'لتثبيته: زرار المشاركة ⬆︎ ← <b>Add to Home Screen</b>'; $('ibGo').hidden = true; }
    else return;
    setTimeout(function () { $('installBar').classList.add('show'); }, 2500);
  }
  function doInstall() {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function () { deferredPrompt = null; $('installBar').classList.remove('show'); $('installBtn').hidden = true; });
  }

  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault(); deferredPrompt = e;
    $('installBtn').hidden = false;
    if (document.body.classList.contains('linked')) maybeInstallBar();
  });
  window.addEventListener('appinstalled', function () { $('installBar').classList.remove('show'); store.set(NOINSTALL, '1'); });
  window.addEventListener('online', function () { if (!loaded && store.get(KEY)) openApp(store.get(KEY)); });

  $('go').addEventListener('click', link);
  $('url').addEventListener('keydown', function (e) { if (e.key === 'Enter') link(); });
  $('installBtn').addEventListener('click', doInstall);
  $('ibGo').addEventListener('click', doInstall);
  $('ibNo').addEventListener('click', function () { store.set(NOINSTALL, '1'); $('installBar').classList.remove('show'); });
  $('retry').addEventListener('click', function () { openApp(store.get(KEY)); });
  $('relink').addEventListener('click', function () { $('url').value = store.get(KEY); store.del(KEY); store.del(BRAND); applyBrand({}); document.body.classList.remove('linked'); show('setup'); });

  // اللينك ممكن ييجي جاهز: …/index.html?u=<لينك البرنامج>   ·   ?reset=1 = يطلب اللينك من الأول
  var qs = new URLSearchParams(location.search);
  if (qs.get('reset')) store.del(KEY);
  var fromLink = cleanUrl(qs.get('u'));
  if (fromLink) store.set(KEY, fromLink);
  if (qs.get('u') || qs.get('reset')) history.replaceState(null, '', location.pathname);

  /* اسم الشركة ولوجو العميل: البرنامج بيبعتهم لما يفتح، والتطبيق بيفتكرهم ويعرضهم في شاشة الفتح */
  function applyBrand(b) {
    b = b || {};
    var logos = document.querySelectorAll('[data-brand-logo]');
    for (var i = 0; i < logos.length; i++) { logos[i].src = b.logo || 'icons/icon-192.png'; logos[i].classList.toggle('custom', !!b.logo); }
    var cos = document.querySelectorAll('[data-brand-co]');
    for (var j = 0; j < cos.length; j++) cos[j].textContent = b.name || '';
    document.title = (b.app || 'إدارة المخزون والمبيعات') + (b.name ? ' — ' + b.name : '');
  }
  try { applyBrand(JSON.parse(store.get(BRAND) || '{}')); } catch (e) { applyBrand({}); }
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || d.type !== 'stock-brand') return;
    if (!/(^|\.)googleusercontent\.com$|^script\.google\.com$/.test(String(e.origin).replace(/^https:\/\//, ''))) return;
    var b = { name: String(d.name || '').slice(0, 80), app: String(d.app || '').slice(0, 80), logo: /^data:image\/(png|jpeg|webp);base64,/.test(d.logo || '') && d.logo.length < 200000 ? d.logo : '' };
    store.set(BRAND, JSON.stringify(b)); applyBrand(b);
  });

  howto();
  var saved = cleanUrl(store.get(KEY));
  if (saved) openApp(saved); else show('setup');

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () { /* still works without it */ });
})();
</script>
</body>
</html>
